requires = ["tox>=4", "tox-uv"]
env_list = ["py310", "py311", "py312", "py313", "py314"]

[env_run_base]
description = "Build and test the wheel on Python {base_python}"
package = "wheel"
wheel_build_env = ".pkg"
dependency_groups = ["dev"]
commands = [
    ["harness", "--help"],
    ["pytest", "tests", "harness/tests"],
]
